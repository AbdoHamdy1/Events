<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحداث العالم - تقويم الفعاليات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* Filters Card */
        .filters-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        select, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
        }

        select:focus {
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Month Navigation */
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
        }

        .month-nav button {
            width: auto;
            padding: 10px 20px;
            background: #667eea;
        }

        .month-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* Calendar Grid */
        .calendar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .weekday {
            text-align: center;
            padding: 12px;
            font-weight: bold;
            background: #f0f0f0;
            border-radius: 10px;
            color: #333;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-cell {
            min-height: 120px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
        }

        .day-cell:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            background: white;
        }

        .day-cell.has-events {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            border-color: #667eea;
        }

        .day-number {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            color: #667eea;
        }

        .event-badge {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .event-count {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .day-cell.empty {
            background: #f0f0f0;
            opacity: 0.5;
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #667eea;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .events-list-modal {
            margin-top: 15px;
        }

        .modal-event-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-event-item:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .day-cell { min-height: 80px; }
            .event-badge { font-size: 9px; }
            .day-number { font-size: 14px; }
            .month-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 أحداث العالم</h1>
            <p>تقويم الفعاليات - اكتشف الأحداث حول العالم</p>
        </div>

        <div class="filters-card">
            <div class="filters-grid">
                <div class="filter-group">
                    <label>🌍 اختر الدولة:</label>
                    <select id="countrySelect">
                        <option value="">-- اختر دولة --</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>🏙️ اختر المدينة:</label>
                    <select id="citySelect" disabled>
                        <option value="">-- اختر مدينة أولاً --</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📅 عدد الأشهر:</label>
                    <select id="monthsCount">
                        <option value="1">شهر واحد</option>
                        <option value="3">3 أشهر</option>
                        <option value="6">6 أشهر</option>
                        <option value="8" selected>8 أشهر</option>
                        <option value="12">12 شهر</option>
                    </select>
                </div>
            </div>
            <button id="searchBtn" disabled>🔍 ابحث عن الأحداث</button>
        </div>

        <div id="calendarContainer"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalDate">📅 الأحداث</h3>
            <div id="modalEventsList" class="events-list-modal"></div>
            <button onclick="closeModal()" style="margin-top:15px; padding:10px 20px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        // ========================================
        // 1️⃣ APIs Configuration
        // ========================================
        
        // Eventbrite API
        const EVENTBRITE_TOKEN = "ZDUJO7E2HZWVCRPMVUW3";
        
        // Ticketmaster API
        const TICKETMASTER_KEY = "sF7cjf3EGJLSLwcxCz4244eYlsewAtc6";
        
        // ترتيب الأولوية للـ APIs (Eventbrite له الأولوية على Ticketmaster)
        const API_PRIORITY = ["eventbrite", "ticketmaster"];
        
        // ========================================
        // 2️⃣ الدول والمدن
        // ========================================
        const countries = [
            "UAE", "Egypt", "Saudi Arabia", "Qatar", "Kuwait", "Jordan", "Morocco",
            "UK", "USA", "Germany", "France", "Italy", "Spain", "Turkey"
        ];
        
        const cities = {
            UAE: ["Dubai", "Abu Dhabi", "Sharjah", "Ajman"],
            Egypt: ["Cairo", "Alexandria", "Giza", "Luxor"],
            "Saudi Arabia": ["Riyadh", "Jeddah", "Mecca", "Medina"],
            Qatar: ["Doha", "Al Rayyan"],
            Kuwait: ["Kuwait City"],
            Jordan: ["Amman", "Aqaba"],
            Morocco: ["Casablanca", "Marrakech", "Rabat"],
            UK: ["London", "Manchester", "Birmingham"],
            USA: ["New York", "Los Angeles", "Chicago", "Miami"],
            Germany: ["Berlin", "Munich", "Hamburg"],
            France: ["Paris", "Lyon", "Marseille"],
            Italy: ["Rome", "Milan", "Florence"],
            Spain: ["Madrid", "Barcelona", "Seville"],
            Turkey: ["Istanbul", "Ankara", "Antalya"]
        };
        
        let selectedCountry = "";
        let selectedCity = "";
        let currentMonthIndex = 0;
        let allEvents = [];
        let monthsData = [];
        
        // تحميل الدول
        function loadCountries() {
            const countrySelect = document.getElementById('countrySelect');
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });
        }
        
        // عند اختيار الدولة
        document.getElementById('countrySelect').addEventListener('change', (e) => {
            selectedCountry = e.target.value;
            const citySelect = document.getElementById('citySelect');
            const searchBtn = document.getElementById('searchBtn');
            
            if (selectedCountry && cities[selectedCountry]) {
                citySelect.disabled = false;
                citySelect.innerHTML = '<option value="">-- اختر مدينة --</option>';
                cities[selectedCountry].forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
                searchBtn.disabled = true;
            } else {
                citySelect.disabled = true;
                searchBtn.disabled = true;
            }
        });
        
        // عند اختيار المدينة
        document.getElementById('citySelect').addEventListener('change', (e) => {
            selectedCity = e.target.value;
            document.getElementById('searchBtn').disabled = !selectedCity;
        });
        
        // ========================================
        // 3️⃣ جلب الأحداث من APIs متعددة
        // ========================================
        
        // جلب من Eventbrite
        async function fetchFromEventbrite(city, country, startDate, endDate) {
            const location = `${city}, ${country}`;
            const url = `https://www.eventbriteapi.com/v3/events/search/?location.address=${encodeURIComponent(location)}&start_date.range_start=${startDate}&start_date.range_end=${endDate}&sort_by=date`;
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${EVENTBRITE_TOKEN}` }
                });
                if (!response.ok) return [];
                const data = await response.json();
                return (data.events || []).map(event => ({
                    id: `eb_${event.id}`,
                    name: event.name?.text || "حدث",
                    date: event.start?.local?.split('T')[0],
                    url: event.url,
                    source: "eventbrite",
                    description: event.description?.text || ""
                }));
            } catch(e) {
                console.log("Eventbrite error:", e);
                return [];
            }
        }
        
        // جلب من Ticketmaster
        async function fetchFromTicketmaster(city, country, startDate, endDate) {
            const countryCodes = { UAE: "AE", Egypt: "EG", "Saudi Arabia": "SA", Qatar: "QA", Kuwait: "KW", Jordan: "JO", Morocco: "MA", UK: "GB", USA: "US", Germany: "DE", France: "FR", Italy: "IT", Spain: "ES", Turkey: "TR" };
            const code = countryCodes[country] || "US";
            const url = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${TICKETMASTER_KEY}&city=${encodeURIComponent(city)}&countryCode=${code}&startDateTime=${startDate}T00:00:00Z&endDateTime=${endDate}T23:59:59Z&size=200`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (!data._embedded?.events) return [];
                return data._embedded.events.map(event => ({
                    id: `tm_${event.id}`,
                    name: event.name || "حدث",
                    date: event.dates?.start?.localDate,
                    url: event.url,
                    source: "ticketmaster",
                    description: event.info || ""
                }));
            } catch(e) {
                console.log("Ticketmaster error:", e);
                return [];
            }
        }
        
        // دمج الأحداث مع إزالة التكرار وإعطاء الأولوية
        function mergeEventsWithPriority(eventsFromAPIs) {
            const eventsMap = new Map();
            
            // لكل API بالترتيب حسب الأولوية
            for (const apiName of API_PRIORITY) {
                const events = eventsFromAPIs[apiName] || [];
                for (const event of events) {
                    const key = `${event.date}_${event.name}`;
                    // إذا كان الحدث موجود مسبقاً، لا نضيفه (الأولوية للأول)
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, event);
                    }
                }
            }
            
            return Array.from(eventsMap.values());
        }
        
        // ========================================
        // 4️⃣ جلب كل الأحداث للشهور المطلوبة
        // ========================================
        async function fetchAllMonthsEvents(city, country, monthsCount) {
            const today = new Date();
            const eventsByMonth = [];
            
            for (let i = 0; i < monthsCount; i++) {
                const startDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                const endDate = new Date(today.getFullYear(), today.getMonth() + i + 1, 0);
                
                const startStr = startDate.toISOString().split('T')[0];
                const endStr = endDate.toISOString().split('T')[0];
                
                console.log(`جلب أحداث ${startDate.toLocaleDateString('ar')} إلى ${endDate.toLocaleDateString('ar')}`);
                
                // جلب من جميع الـ APIs
                const [eventbriteEvents, ticketmasterEvents] = await Promise.all([
                    fetchFromEventbrite(city, country, startStr, endStr),
                    fetchFromTicketmaster(city, country, startStr, endStr)
                ]);
                
                const allEventsObj = {
                    eventbrite: eventbriteEvents,
                    ticketmaster: ticketmasterEvents
                };
                
                const mergedEvents = mergeEventsWithPriority(allEventsObj);
                
                eventsByMonth.push({
                    month: startDate.getMonth(),
                    year: startDate.getFullYear(),
                    events: mergedEvents,
                    startDate: startDate,
                    endDate: endDate
                });
            }
            
            return eventsByMonth;
        }
        
        // ========================================
        // 5️⃣ عرض التقويم
        // ========================================
        function renderCalendar(monthData, monthIndex) {
            const container = document.getElementById('calendarContainer');
            const startDate = monthData.startDate;
            const year = startDate.getFullYear();
            const month = startDate.getMonth();
            
            // أول يوم في الشهر
            const firstDay = new Date(year, month, 1);
            const startDayOfWeek = firstDay.getDay(); // 0 = الأحد في بعض الأنظمة، نعدلها
        
            // عدد أيام الشهر
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // تجميع الأحداث حسب اليوم
            const eventsByDay = {};
            monthData.events.forEach(event => {
                const day = new Date(event.date).getDate();
                if (!eventsByDay[day]) eventsByDay[day] = [];
                eventsByDay[day].push(event);
            });
            
            // بناء التقويم
            let daysHtml = '';
            // الأسبوع يبدأ من السبت (6) أو الأحد (0) - للعربية نبدأ من الأحد
            for (let i = 0; i < startDayOfWeek; i++) {
                daysHtml += `<div class="day-cell empty"></div>`;
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const hasEvents = eventsByDay[day] && eventsByDay[day].length > 0;
                const events = eventsByDay[day] || [];
                const eventCount = events.length;
                
                daysHtml += `
                    <div class="day-cell ${hasEvents ? 'has-events' : ''}" onclick="showDayEvents(${day}, ${month}, ${year})">
                        <div class="day-number">${day}</div>
                        ${events.slice(0, 2).map(e => `<div class="event-badge">${e.name.substring(0, 20)}</div>`).join('')}
                        ${eventCount > 2 ? `<div class="event-count">+${eventCount - 2}</div>` : ''}
                    </div>
                `;
            }
            
            const monthNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const weekdays = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            
            container.innerHTML = `
                <div class="month-nav">
                    <button onclick="changeMonth(-1)" ${monthIndex === 0 ? 'disabled' : ''}>◀ الشهر السابق</button>
                    <div class="month-title">${monthNames[month]} ${year}</div>
                    <button onclick="changeMonth(1)" ${monthIndex === monthsData.length - 1 ? 'disabled' : ''}>الشهر التالي ▶</button>
                </div>
                <div class="calendar">
                    <div class="weekdays">
                        ${weekdays.map(day => `<div class="weekday">${day}</div>`).join('')}
                    </div>
                    <div class="days-grid">
                        ${daysHtml}
                    </div>
                </div>
            `;
        }
        
        // تغيير الشهر
        function changeMonth(delta) {
            const newIndex = currentMonthIndex + delta;
            if (newIndex >= 0 && newIndex < monthsData.length) {
                currentMonthIndex = newIndex;
                renderCalendar(monthsData[currentMonthIndex], currentMonthIndex);
            }
        }
        
        // عرض أحداث اليوم
        function showDayEvents(day, month, year) {
            const monthData = monthsData[currentMonthIndex];
            const events = monthData.events.filter(e => {
                const eventDate = new Date(e.date);
                return eventDate.getDate() === day && 
                       eventDate.getMonth() === month && 
                       eventDate.getFullYear() === year;
            });
            
            const modal = document.getElementById('modal');
            const modalDate = document.getElementById('modalDate');
            const modalEventsList = document.getElementById('modalEventsList');
            
            const monthNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            modalDate.textContent = `📅 ${day} ${monthNames[month]} ${year} - ${events.length} فعالية`;
            
            if (events.length === 0) {
                modalEventsList.innerHTML = '<p>لا توجد فعاليات في هذا اليوم</p>';
            } else {
                modalEventsList.innerHTML = events.map(event => `
                    <div class="modal-event-item" onclick="window.open('${event.url}', '_blank')">
                        <strong>🎯 ${event.name}</strong><br>
                        <small>📅 ${event.date} | 📍 من ${event.source === 'eventbrite' ? 'Eventbrite' : 'Ticketmaster'}</small>
                    </div>
                `).join('');
            }
            
            modal.style.display = "flex";
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = "none";
        }
        
        // ========================================
        // 6️⃣ البحث الرئيسي
        // ========================================
        document.getElementById('searchBtn').addEventListener('click', async () => {
            if (!selectedCity || !selectedCountry) return;
            
            const monthsCount = parseInt(document.getElementById('monthsCount').value);
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '<div class="loading">⏳ جاري البحث عن الأحداث في ' + selectedCity + '... هذا قد يستغرق بضع ثوانٍ</div>';
            
            try {
                monthsData = await fetchAllMonthsEvents(selectedCity, selectedCountry, monthsCount);
                currentMonthIndex = 0;
                
                if (monthsData.length > 0 && monthsData.some(m => m.events.length > 0)) {
                    renderCalendar(monthsData[0], 0);
                } else {
                    container.innerHTML = `
                        <div class="error">
                            📭 لا توجد أحداث في ${selectedCity}, ${selectedCountry} خلال الأشهر القادمة<br><br>
                            💡 نصيحة: جرب دبي - دبي لديها الكثير من الفعاليات!<br>
                            💡 أو جرب مدينة أخرى
                        </div>
                    `;
                }
            } catch(error) {
                console.error(error);
                container.innerHTML = '<div class="error">❌ حدث خطأ في تحميل الأحداث. حاول مرة أخرى.</div>';
            }
        });
        
        // بدء التطبيق
        loadCountries();
        
        // إغلاق المودال عند الضغط خارجها
        window.onclick = (event) => {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
