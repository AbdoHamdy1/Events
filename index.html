<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحداث العالم - تقويم الفعاليات</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 أحداث العالم</h1>
            <p>تقويم الفعاليات</p>
        </div>

        <div class="filters-card">
            <div class="filters-grid">
                <div class="filter-group">
                    <label>🌍 اختر الدولة:</label>
                    <select id="countrySelect">
                        <option value="">-- اختر دولة --</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>🏙️ اختر المدينة:</label>
                    <select id="citySelect" disabled>
                        <option value="">-- اختر مدينة أولاً --</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📅 عدد الأشهر:</label>
                    <select id="monthsCount">
                        <option value="1">شهر واحد</option>
                        <option value="3">3 أشهر</option>
                        <option value="6">6 أشهر</option>
                        <option value="8" selected>8 أشهر</option>
                        <option value="12">12 شهر</option>
                    </select>
                </div>
            </div>
            <button id="searchBtn" disabled>🔍 ابحث عن الأحداث</button>
        </div>

        <div id="calendarContainer"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalDate">📅 الأحداث</h3>
            <div id="modalEventsList"></div>
            <button onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
